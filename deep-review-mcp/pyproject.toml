[project]
name = "deep-review-mcp"
version = "0.2.1"
description = "K12错题收集与智能分析MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # FSRS v6 间隔重复调度算法 — 替代固定艾宾浩斯查表，支持 4 档评分与 DSR 记忆模型
    # [optimizer] 拉入 Optimizer 用于 UI 触发的个性化 21 参数计算（依赖 numpy/torch）
    "fsrs[optimizer]>=6.0.0",
]

[project.optional-dependencies]
# OCR 引擎依赖 — 由于 paddleocr/paddlepaddle 体积大且与 Python 3.13 兼容性较差，
# 拆为可选依赖。运行 `uv sync --extra ocr` 或 `uv pip install paddleocr paddlepaddle` 安装。
# OCR 工具内部使用懒加载，未安装时调用 OCR 会得到友好错误提示。
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27",
    "playwright>=1.40",
]

[project.scripts]
deep-review-mcp = "deep_review_mcp.server:main"
deep-review-web = "deep_review_mcp.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ──────────────────────────────────────────
# Pytest 配置
# ──────────────────────────────────────────
[tool.pytest.ini_options]
markers = [
    "e2e: End-to-end tests that require Playwright and a running web server. Run with `uv run pytest -m e2e`, CI splits them into a dedicated job.",
]
asyncio_mode = "auto"
