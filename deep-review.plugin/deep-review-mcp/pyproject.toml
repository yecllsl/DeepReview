[project]
name = "deep-review-mcp"
version = "0.5.0"
description = "K12错题收集与智能分析MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # FSRS v6 间隔重复调度算法 — 替代固定艾宾浩斯查表，支持 4 档评分与 DSR 记忆模型
    # 个性化 21 参数优化（Optimizer，依赖 numpy/pandas/torch 约 570MB）按需安装：uv sync --extra optimize
    "fsrs>=6.0.0",
]

[project.optional-dependencies]
# 可选：FSRS 21 参数个性化优化（Optimizer，依赖 numpy/pandas/torch，约 570MB）
# 复习记录积累 512+ 条才有意义；未安装时优化面板提示按需安装（见 fsrs_scheduler.is_optimizer_available）
optimize = [
    "fsrs[optimizer]>=6.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
deep-review-mcp = "deep_review_mcp.server:main"
deep-review-web = "deep_review_mcp.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ──────────────────────────────────────────
# Pytest 配置
# ──────────────────────────────────────────
[tool.pytest.ini_options]
markers = [
    "e2e: End-to-end tests that require Playwright and a running web server. Run with `uv run pytest -m e2e`, CI splits them into a dedicated job.",
]
asyncio_mode = "auto"
